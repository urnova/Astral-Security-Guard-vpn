</div></div></div>`,

function ctry(q=''){return CT.filter(c=>c[1].toLowerCase().includes(q.toLowerCase())).map(([cc,n,ms,nodes])=>`<div class="row ctry cl" style="flex-direction:column;align-items:stretch;gap:0;padding:0"><div style="display:flex;align-items:center;gap:14px;padding:13px 16px" data-open><span class="cc">${cc}</span><div class="t"><b>${n}</b><small>${nodes.length} nœud(s) · plus rapide : ${nodes[0]}</small></div><span class="chip ${ms>60?'warn':''}">${ms} ms</span><span class="chev">${ic('chev',18)}</span></div><div class="nodes">${nodes.map(x=>`<div class="row cl ${S.node===x?'sel':''}" style="margin:0 12px 10px" data-node="${x}"><div class="t"><b>${x}</b><small>WireGuard · ${900-ms*2} Mbps</small></div></div>`).join('')}</div></div>`).join('')||'<div class="empty">Aucun pays trouvé</div>'}

// ===== runtime =====
const M=$('#main');
function go(p,opts={}){S.page=p;$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));const b=$(`#nav button[data-p="${p}"]`);$('#pill').style.transform=`translateY(${b?b.offsetTop:-60}px)`;$('#pill').style.opacity=b?1:0;
 M.innerHTML=PAGES[p]();M.scrollTop=0;hook();if(opts.scan)setTimeout(()=>$('#scanBtn')&&$('#scanBtn').click(),700)}
function hook(){
 $$('[data-go][role=button]',M).forEach(e=>e.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();e.click()}});

 $$('[data-count]',M).forEach(e=>{const to=+e.dataset.count,t0=performance.now();(function f(n){const p=Math.min((n-t0)/1400,1);e.textContent=Math.round(to*(1-Math.pow(1-p,4)));if(p<1)requestAnimationFrame(f)})(t0)});
 setTimeout(()=>{$$('[data-w]',M).forEach(e=>e.style.width=e.dataset.w+'%');$$('[data-ring]',M).forEach(e=>e.style.strokeDashoffset=e.dataset.c*(1-e.dataset.ring));$$('[data-h]',M).forEach(e=>e.style.height=e.dataset.h+'%')},80);
 $$('.card',M).forEach(c=>c.onmousemove=e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')});
 $$('.sw[data-k]',M).forEach(s=>s.onclick=()=>{const k=s.dataset.k;S.t[k]=S.t[k]?0:1;s.classList.toggle('on',!!S.t[k])});
 $$('.sw[data-local]',M).forEach(s=>s.onclick=()=>{s.classList.toggle('on');toast(s.classList.contains('on')?'Activé au démarrage':'Désactivé au démarrage')});
 $$('[data-go]',M).forEach(e=>e.onclick=()=>go(e.dataset.go,{scan:e.dataset.scan}));
 $$('[data-toast]',M).forEach(e=>e.onclick=ev=>{ev.stopPropagation();toast(e.dataset.toast)});
 $$('.seg',M).forEach(sg=>$$('button',sg).forEach(b=>b.onclick=()=>{$$('button',sg).forEach(x=>x.classList.remove('on'));b.classList.add('on');if(sg.id==='gprof')S.prof=b.textContent;if(sg.id==='vproto')S.proto=b.textContent}));
 const P={home:homeInit,security:secInit,performance:perfInit,gaming:gameInit,network:netInit,vpn:vpnInit,settings:setInit}[S.page];P&&P()}
// sparklines
const SP={cpu:{v:25,d:[],r:[8,70]},ram:{v:45,d:[],r:[40,52]},dsk:{v:95,d:[],r:[94,95]},png:{v:16,d:[],r:[11,26]}};
for(const k in SP)for(let i=0;i<30;i++)SP[k].d.push(SP[k].v+(Math.random()-.5)*(SP[k].r[1]-SP[k].r[0])/2);
function drawSp(k){const s=SP[k],svg=$('#sp-'+k);if(!svg)return;const mn=Math.min(...s.d)-2,mx=Math.max(...s.d)+2,pts=s.d.map((v,i)=>[i*200/29,44-(v-mn)/(mx-mn)*40]);const l='M'+pts.map(p=>p.join(',')).join('L');svg.children[1].setAttribute('d',l);svg.children[0].setAttribute('d',l+'L200,46L0,46Z');const el=$('#v-'+k);if(el)el.textContent=Math.round(s.d[29])}
let spT;function homeInit(){clearInterval(spT);for(const k in SP)drawSp(k);spT=setInterval(()=>{if(S.page!=='home')return clearInterval(spT);for(const k in SP){const s=SP[k];let n=s.d[29]+(Math.random()-.5)*(s.r[1]-s.r[0])/3;n=Math.max(s.r[0],Math.min(s.r[1],n));s.d.push(n);s.d.shift();drawSp(k)}},1000)}
// security
let scT;function secInit(){
 $('#stabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.scanTab=b.textContent;$$('#stabs button').forEach(x=>x.classList.toggle('on',x===b));$('#stab').innerHTML=secTab();hook2()};
 function hook2(){$$('#stab .sw[data-k]').forEach(s=>s.onclick=()=>{const k=s.dataset.k;S.t[k]=S.t[k]?0:1;s.classList.toggle('on',!!S.t[k])});$$('#stab [data-toast]').forEach(e=>e.onclick=()=>toast(e.dataset.toast))}hook2();
 const FILES=['C:\\Windows\\System32\\ntdll.dll','C:\\Program Files\\Steam\\steam.exe','C:\\Users\\Enzo\\AppData\\Local\\Discord\\app.exe','HKLM\\SOFTWARE\\Microsoft\\Windows\\Run','C:\\Games\\Minecraft\\mods\\create.jar','Mémoire : processus chrome.exe','C:\\Windows\\SysWOW64\\kernel32.dll','Mémoire : processus Antigravity.exe'];
 $('#scanBtn').onclick=()=>{const b=$('#scanBtn');if(b.disabled)return;b.disabled=true;const rg=$('#sr'),fg=$('#sr .fg'),c=+fg.dataset.c;rg.classList.add('scan');fg.style.transition='none';fg.style.strokeDashoffset=c;let p=0,f=0;const t0=Date.now(),log=$('#scLog');log.innerHTML='';$('#scSub').textContent='Analyse en cours…';
  scT=setInterval(()=>{p+=1.2;f+=Math.round(180+Math.random()*260);$('#scTxt').textContent=Math.round(p)+'%';fg.style.transition='stroke-dashoffset .1s linear';fg.style.strokeDashoffset=c*(1-p/100);$('#scF').textContent=f.toLocaleString('fr-FR');$('#scD').textContent=Math.round((Date.now()-t0)/1000)+' s';
   const d=document.createElement('div');d.textContent=FILES[Math.floor(Math.random()*FILES.length)];log.appendChild(d);if(log.children.length>8)log.firstChild.remove();
   if(p>=100){clearInterval(scT);rg.classList.remove('scan');$('#scTxt').textContent='✔ Sain';S.scanDone='0 menace · à l\'instant';$('#scSub').textContent=S.scanDone;const o=document.createElement('div');o.className='ok';o.textContent='Analyse terminée — aucune menace détectée';log.appendChild(o);b.disabled=false;toast('Analyse terminée : aucune menace')}},90)}}
// performance
function perfInit(){
 const cl=$('#cl');cl.onclick=e=>{const cb=e.target.closest('.row')&&e.target.closest('.row').querySelector('.cb');if(!cb)return;cb.classList.toggle('on');let t=0;$$('.cb.on',cl).forEach(x=>t+=parseFloat(x.dataset.s.replace(',','.')));$('#clTot').textContent=t.toFixed(1).replace('.',',')+' Go'};
 $$('.cb',cl).forEach(c=>c.innerHTML=ic('check',13));
 $('#maint').onclick=()=>{const w=$('#mProg');w.style.display='block';const i=w.querySelector('i');const st=['Purge de la mémoire en veille…','Nettoyage des fichiers temporaires…','Vidage du cache DNS…','Vérification SMART…','Terminé !'];i.style.transition='none';i.style.width='0';let k=0;const it=setInterval(()=>{k++;i.style.transition='width .5s';i.style.width=k*20+'%';$('#mTxt').textContent=st[k-1];if(k===5){clearInterval(it);toast('Maintenance terminée : 12,0 Go libérés')}},700)}}

// network

 $('#dnsl').onclick=e=>{const r=e.target.closest('[data-dns]');if(!r)return;S.dns=r.dataset.dns;$$('#dnsl .row').forEach(x=>x.classList.toggle('sel',x===r));toast('DNS : '+r.querySelector('b').textContent)};
 $('#spd').onclick=()=>{const b=$('#spd');b.disabled=true;const fg=$('#gfg');let n=0,ph=0;const it=setInterval(()=>{n+=(568-n)*.07+2;if(n>=567){n=568;clearInterval(it);$('#s1').textContent='16 ms';$('#s2').textContent='1 ms';$('#s3').textContent='568 Mbps';$('#s4').textContent='130 Mbps';b.disabled=false;toast('Test terminé : 568 Mbps ↓ / 130 Mbps ↑','wifi')}else n+=(Math.random()-.5)*14;$('#gv').textContent=Math.round(n);fg.style.strokeDashoffset=393*(1-Math.min(n/1000,1))},45)}}

let vT;function vpnInit(){
 $('#vq').oninput=e=>{$('#vl').innerHTML=ctry(e.target.value);bindV()};bindV();
 function bindV(){$$('#vl [data-open]').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));$$('#vl [data-node]').forEach(n=>n.onclick=e=>{e.stopPropagation();S.node=n.dataset.node;$$('#vl [data-node]').forEach(x=>x.classList.toggle('sel',x===n));toast('Nœud sélectionné : '+S.node,'globe')})}
 $('#vbtn').onclick=()=>{const b=$('#vbtn');clearInterval(vT);if(S.vpn==='on'){S.vpn='off';render();return}S.vpn='load';render();setTimeout(()=>{S.vpn='on';render();toast('Tunnel '+S.proto+' établi · IP masquée','lock');let s=0;vT=setInterval(()=>{if(S.page!=='vpn'||S.vpn!=='on')return clearInterval(vT);s++;$('#vT').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('#vD').textContent=(480+Math.random()*60|0)+' Mbps';$('#vU').textContent=(110+Math.random()*30|0)+' Mbps'},1000)},1600);
  function render(){const bb=$('#vbtn');bb.className='vbtn '+S.vpn;bb.innerHTML=vbInner();$('#vst').innerHTML=vst()}}}

 $('#smenu').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.setTab=b.dataset.s;$$('#smenu button').forEach(x=>x.classList.toggle('on',x===b));panel()};
 function panel(){const p=$('#spanel');p.innerHTML=setPanel();p.style.animation='none';p.offsetHeight;p.style.animation='';bindP()}
 function bindP(){const p=$('#spanel');$$('.sw[data-k]',p).forEach(s=>s.onclick=()=>{const k=s.dataset.k;S.t[k]=S.t[k]?0:1;s.classList.toggle('on',!!S.t[k])});
  $$('[data-th]',p).forEach(t=>t.onclick=()=>{S.theme=t.dataset.th;document.documentElement.dataset.theme=S.theme;$$('[data-th]',p).forEach(x=>x.classList.toggle('on',x===t));toast('Thème appliqué : '+t.querySelector('b').textContent,'brush')});
  const r=$('#rmSw');if(r)r.onclick=()=>{S.rm=!S.rm;r.classList.toggle('on',S.rm);$('.win').classList.toggle('rm',S.rm)};

  const d=$('#diagBtn');if(d)d.onclick=()=>{const L=$('#diagL');L.innerHTML='';[['Microsoft Defender','Service actif'],['Pare-feu Windows','Activé'],['Pilote WireGuard','Installé'],['Accès administrateur','Accordé'],['Lecture SMART','Disponible']].forEach((x,i)=>setTimeout(()=>{L.insertAdjacentHTML('beforeend',row('check',x[0],x[1],'<span class="chip">OK</span>'))},i*450))}}

$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.p)};
$('#userBtn').onclick=()=>go('settings');$('#userBtn').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go('settings')}};

function cmd(show){const c=$('#cmd');c.classList.toggle('show',show);if(show){$('#cq').value='';cl('');$('#cq').focus()}}
function cl(q){const it=[['home','Vue d’ensemble'],['security','Sécurité'],['performance','Performance'],['gaming','Jeux'],['network','Réseau'],['vpn','VPN'],['settings','Paramètres']].filter(x=>x[1].toLowerCase().includes(q.toLowerCase()));$('#cl2').innerHTML=it.map(x=>`<div class="row cl" data-p="${x[0]}">${ic(x[0]==='settings'?'gear':x[0]==='network'?'wifi':x[0]==='gaming'?'pad':x[0]==='security'?'shield':x[0]==='performance'?'bolt':x[0]==='vpn'?'lock':'home',18)}<div class="t"><b>${x[1]}</b></div></div>`).join('')}
$('#cq').oninput=e=>cl(e.target.value);$('#cl2').onclick=e=>{const r=e.target.closest('[data-p]');if(r){cmd(false);go(r.dataset.p)}};$('#cmd').onclick=e=>{if(e.target.id==='cmd')cmd(false)};

['home','shield','bolt','pad','wifi','lock'].forEach((n,i)=>$('#i'+i).outerHTML=ic(n,20));$('#ig').outerHTML=ic('gear',16);
